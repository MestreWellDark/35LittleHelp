name: Publish module release

on:
  push:
    branches:
      - main
    paths:
      - "module.json"
      - "scripts/**"
      - "styles/**"
      - "lang/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d35e-little-helper-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate
        run: |
          npm run validate
          npm test
          find scripts tests -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Build Foundry package
        run: |
          mkdir -p dist
          cp module.json dist/module.json
          zip -r dist/d35e-little-helper.zip module.json scripts styles lang README.md CHANGELOG.md LICENSE

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('module.json', 'utf8')).version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/module.json dist/d35e-little-helper.zip --clobber
          else
            gh release create "$TAG" dist/module.json dist/d35e-little-helper.zip               --target "$GITHUB_SHA"               --title "D35E Little Helper $TAG"               --notes-file CHANGELOG.md
          fi
